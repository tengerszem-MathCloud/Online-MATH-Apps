<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számtani sorozat összegképlete</title>

    <!-- Tailwind CSS betöltése -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Dinamikus MathJax betöltő (Online CDN vagy Offline mikro-szerver) -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
        
        const isOnline = window.location.hostname.includes("github.io");
        
        // Mivel a fájl az 'apps' mappában van, offline esetben egy könyvtárral feljebb (../) keressük a mathjax mappát
        const mathjaxUrl = isOnline 
            ? "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" 
            : "../mathjax/tex-mml-chtml.js";
            
        const script = document.createElement('script');
        script.src = mathjaxUrl;
        script.async = true;
        document.head.appendChild(script);
    </script>

    <style>
        /* Világoskék négyzethálós "füzetlap" háttér sötét módban */
        body {
            background-color: #111827; 
            background-image: 
                linear-gradient(to right, rgba(173, 216, 230, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(173, 216, 230, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Dinamikusan renderelt cím ($S_n$) -->
    <h1 class="text-3xl md:text-4xl font-bold text-[#add8e6] mb-8 text-center drop-shadow-md">
        Szint 2.1: Számtani sorozat összegképlete ($S_n$)
    </h1>

    <!-- Interaktív kártya tartalom -->
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-8 max-w-3xl w-full shadow-2xl text-center">
        
        <p class="text-2xl md:text-3xl font-light text-gray-200 mb-10">
            Egy színház nézőterén <strong class="text-white font-bold">15 sor</strong> található.
        </p>

        <!-- Javított gombok tárolója (flex-wrap engedi a sortörést mobilon) -->
        <div class="flex flex-wrap justify-center items-center gap-4">
            
            <button class="bg-[#2196f3] hover:bg-[#1976d2] text-white px-6 py-3 rounded-full transition-all flex items-center shadow-lg font-medium text-sm sm:text-base">
                <span class="w-3 h-3 bg-[#ff5252] rounded-full mr-3 shadow-[0_0_8px_#ff5252]"></span>
                Lézermutató
            </button>

            <button class="bg-[#2196f3] hover:bg-[#1976d2] text-white px-6 py-3 rounded-full transition-all flex items-center shadow-lg font-medium text-sm sm:text-base">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z"></path>
                </svg>
                Hangos magyarázat
            </button>

            <button class="bg-[#2196f3] hover:bg-[#1976d2] text-white px-6 py-3 rounded-full transition-all flex items-center shadow-lg font-medium text-sm sm:text-base">
                Tovább a levezetéshez
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </div>
    </div>
</body>
</html>
