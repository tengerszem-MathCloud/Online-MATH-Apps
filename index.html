<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math_server Kirakat</title>
    <style>
        :root {
            --bg-color: #121212;
            --grid-color: #add8e6;
            --text-color: #e0e0e0;
            --card-bg: #1e2a38;
            --hover-bg: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                linear-gradient(rgba(173, 216, 230, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(173, 216, 230, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            color: var(--grid-color);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(173, 216, 230, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            background-color: var(--hover-bg);
            border-color: rgba(173, 216, 230, 0.5);
        }

        .card h2 {
            margin-top: 0;
            color: #4caf50;
            font-size: 1.5rem;
        }

        .card p {
            line-height: 1.5;
            color: #b0bec5;
        }

        .tag {
            display: inline-block;
            background-color: rgba(173, 216, 230, 0.1);
            color: var(--grid-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 1rem;
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Online-Math-Apps Kirakat</h1>
        <div class="grid">
            <!-- Sorozatok Demonstráció -->
            <a href="sorozatok_osszeg_demo.html" class="card">
                <div>
                    <h2>Sorozatok Összegképlete</h2>
                    <p>Szókratészi demonstráció a számtani sorozatok összegképletének megértéséhez (2.1-es szint). Lépésről lépésre haladó, beszédalapú magyarázattal.</p>
                </div>
                <span class="tag">Demonstráció (Mód B)</span>
            </a>
            
            <!-- Ide jöhetnek majd a jövőbeli HTML fájlok linkjei -->
            
            <!--
            <a href="masik_app.html" class="card">
                <div>
                    <h2>Minta App</h2>
                    <p>Egy újabb interaktív matematikai alkalmazás leírása.</p>
                </div>
                <span class="tag">Gyakorló (Mód A)</span>
            </a>
            -->
        </div>
    </div>
</body>
</html>
